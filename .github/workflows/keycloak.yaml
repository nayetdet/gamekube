name: Keycloak

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keycloak.yaml"
      - "infra/docker/keycloak/**"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: true
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/keycloak
          file: infra/docker/keycloak/Dockerfile
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:keycloak
          push: true
