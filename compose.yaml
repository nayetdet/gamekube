services:
  postgres:
    image: postgres:18-alpine
    container_name: gamekube-postgres
    command: ["postgres", "-c", "max_prepared_transactions=100"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  flyway:
    image: flyway/flyway:13-alpine
    container_name: gamekube-flyway
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:?}
      - -user=${POSTGRES_USER:?}
      - -password=${POSTGRES_PASSWORD:?}
      - -schemas=gamekube,keycloak
      - -defaultSchema=gamekube
      - -connectRetries=60
      - migrate
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: gamekube-keycloak
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_SCHEMA: keycloak
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?}
      KC_DB_USERNAME: ${POSTGRES_USER:?}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KC_DB_KIND_APPLICATION: postgres
      KC_DB_URL_FULL_APPLICATION: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?}?currentSchema=gamekube
      KC_DB_USERNAME_APPLICATION: ${POSTGRES_USER:?}
      KC_DB_PASSWORD_APPLICATION: ${POSTGRES_PASSWORD:?}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/data/import:/opt/keycloak/data/import:ro
      - ./infra/keycloak/providers:/opt/keycloak/providers:ro
      - ./infra/keycloak/themes/keywind/theme:/opt/keycloak/themes:ro
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: gamekube-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
