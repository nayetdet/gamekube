import com.tngtech.archunit.core.importer.ClassFileImporter

import static com.tngtech.archunit.library.Architectures.layeredArchitecture

buildscript {
	repositories {
		mavenCentral()
	}

	dependencies {
		classpath 'com.tngtech.archunit:archunit:1.5.0'
		classpath 'org.flywaydb:flyway-database-postgresql:12.4.0'
		classpath 'org.postgresql:postgresql:42.7.11'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.0.2'
	id 'org.flywaydb.flyway' version '12.4.0'
}

group = 'io.github.nayetdet'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.keycloak:keycloak-admin-client:26.0.11'
	implementation 'io.github.wimdeblauwe:error-handling-spring-boot-starter:5.1.1'
	implementation 'io.fabric8:kubernetes-client:7.8.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

flyway {
	url = System.getenv('SPRING_DATASOURCE_URL')
	user = System.getenv('SPRING_DATASOURCE_USERNAME')
	password = System.getenv('SPRING_DATASOURCE_PASSWORD')
	locations = ['filesystem:src/main/resources/db/migration']
	schemas = ['gamekube']
	defaultSchema = 'gamekube'
	baselineOnMigrate = true
}

spotless {
	java {
		googleJavaFormat('1.27.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('check') {
	dependsOn tasks.named('classes')
	notCompatibleWithConfigurationCache('Architecture rules access source sets during execution')

	doLast {
		def basePackage = 'io.github.nayetdet.gamekube'

		layeredArchitecture()
				.consideringAllDependencies()
				.layer('Controller').definedBy("${basePackage}.controller..")
				.layer('Service').definedBy("${basePackage}.service..")
				.layer('Repository').definedBy("${basePackage}.repository..")
				.layer('Mapper').definedBy("${basePackage}.mapper..")
				.layer('Security').definedBy("${basePackage}.security..")
				.layer('Config').definedBy("${basePackage}.config..")
				.layer('Payload').definedBy("${basePackage}.payload..")
				.layer('Model').definedBy("${basePackage}.model..")
				.layer('Enums').definedBy("${basePackage}.enums..")
				.layer('Exception').definedBy("${basePackage}.exception..")
				.whereLayer('Controller').mayNotBeAccessedByAnyLayer()
				.whereLayer('Service').mayOnlyBeAccessedByLayers('Controller')
				.whereLayer('Repository').mayOnlyBeAccessedByLayers('Service', 'Security')
				.whereLayer('Mapper').mayOnlyBeAccessedByLayers('Service', 'Mapper')
				.whereLayer('Security').mayOnlyBeAccessedByLayers('Controller', 'Service', 'Config', 'Security')
				.whereLayer('Config').mayNotBeAccessedByAnyLayer()
				.whereLayer('Payload').mayOnlyBeAccessedByLayers('Controller', 'Service', 'Repository', 'Mapper', 'Payload')
				.whereLayer('Model').mayOnlyBeAccessedByLayers('Service', 'Repository', 'Mapper', 'Security', 'Payload', 'Model')
				.whereLayer('Enums').mayOnlyBeAccessedByLayers('Service', 'Repository', 'Mapper', 'Model', 'Payload', 'Enums')
				.whereLayer('Exception').mayOnlyBeAccessedByLayers('Controller', 'Service', 'Security', 'Exception')
				.check(new ClassFileImporter().importPaths(project.sourceSets.main.output.classesDirs.files.collect { it.toPath() }))
	}
}
