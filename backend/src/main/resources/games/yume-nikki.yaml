name: Yume Nikki
description: Yume Nikki is a surreal, dialogue-free exploration game in which the reclusive Madotsuki sleeps in her room and wanders through a network of strange, interconnected dream worlds, collecting effects and interpreting what she sees.
image: /images/yume-nikki.png
resources:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        app: ${GAME_NAME}
        game: ${GAME_ID}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${GAME_NAME}
      template:
        metadata:
          labels:
            app: ${GAME_NAME}
            game: ${GAME_ID}
        spec:
          containers:
            - name: ${GAME_ID}
              image: ghcr.io/nayetdet/yume-nikki-nx-docker:latest
              ports:
                - name: http
                  containerPort: 3000
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        game: ${GAME_ID}
    spec:
      selector:
        app: ${GAME_NAME}
      ports:
        - name: http
          port: 3000
          targetPort: http
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        game: ${GAME_ID}
    spec:
      ingressClassName: traefik
      tls:
        - hosts:
            - ${GAME_HOST}
          secretName: ${GAME_TLS_SECRET}
      rules:
        - host: ${GAME_HOST}
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${GAME_NAME}
                    port:
                      name: http
