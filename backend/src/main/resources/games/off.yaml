name: OFF
description: "The Batter has been entrusted with a sacred mission: purify an uncanny and hopeless world haunted by specters. Guided through its strange Zones, he confronts the forces that inhabit this world and uncovers its secrets."
image: /images/off.png
hasSave: true
resources:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        app: ${GAME_NAME}
        game: ${GAME_ID}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${GAME_NAME}
      template:
        metadata:
          labels:
            app: ${GAME_NAME}
            game: ${GAME_ID}
        spec:
          terminationGracePeriodSeconds: 120
          securityContext:
            fsGroup: 911
          initContainers:
            - name: restore-game-data
              image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef: {name: minio, key: rootUser}
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: minio, key: rootPassword}
                - name: MC_HOST_storage
                  value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio.${GAME_NAMESPACE}.svc:9000
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  save_path="storage/${GAME_SAVE_BUCKET}/${GAME_ID}/${GAME_USER_ID}"
                  : > /data/.gamekube-prefix
                  mc cp /data/.gamekube-prefix "$save_path/.gamekube-prefix"
                  mc mirror --overwrite "$save_path" /data
                  rm -f /data/.gamekube-prefix
                  mc rm "$save_path/.gamekube-prefix"
              volumeMounts:
                - {name: game-data, mountPath: /data}
          containers:
            - name: ${GAME_ID}
              image: ghcr.io/nayetdet/off-docker:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  mkdir -p /config/.local/share/off
                  if ! grep -Fq -- '--save-path /config/.local/share/off' /etc/services.d/off/run; then
                    grep -Fq -- '--project-path /opt/off/off-english-3.0' /etc/services.d/off/run
                    sed -i 's|--project-path /opt/off/off-english-3.0|--project-path /opt/off/off-english-3.0 --save-path /config/.local/share/off|' /etc/services.d/off/run
                  fi
                  exec /init
              volumeMounts:
                - {name: game-data, mountPath: /config/.local/share/off}
              ports:
                - name: http
                  containerPort: 3000
              readinessProbe:
                httpGet:
                  path: /
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 12
            - name: persist-game-data
              image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef: {name: minio, key: rootUser}
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: minio, key: rootPassword}
                - name: MC_HOST_storage
                  value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio.${GAME_NAMESPACE}.svc:9000
              command: ["/bin/sh", "-c"]
              args:
                - |
                  while true; do
                    mc mirror --overwrite /data "storage/${GAME_SAVE_BUCKET}/${GAME_ID}/${GAME_USER_ID}"
                    sleep 10
                  done
              lifecycle:
                preStop:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - >-
                        sleep 10 && timeout --signal=TERM --kill-after=5s 90s
                        mc mirror --overwrite /data
                        "storage/${GAME_SAVE_BUCKET}/${GAME_ID}/${GAME_USER_ID}"
              volumeMounts:
                - {name: game-data, mountPath: /data}
            - name: oauth2-proxy
              image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
              env:
                - name: OAUTH2_PROXY_COOKIE_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${GAME_NAME}-auth-cookie
                      key: cookie-secret
                - name: OAUTH2_PROXY_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${GAME_NAME}-auth-cookie
                      key: client-secret
              args:
                - --provider=keycloak-oidc
                - --oidc-issuer-url=${GAME_KEYCLOAK_INTERNAL_ISSUER_URL}
                - --login-url=${GAME_KEYCLOAK_ISSUER_URL}/protocol/openid-connect/auth
                - --redeem-url=${GAME_KEYCLOAK_INTERNAL_ISSUER_URL}/protocol/openid-connect/token
                - --oidc-jwks-url=${GAME_KEYCLOAK_INTERNAL_ISSUER_URL}/protocol/openid-connect/certs
                - --insecure-oidc-skip-issuer-verification=true
                - --oidc-audience-claim=azp
                - --oidc-email-claim=preferred_username
                - --oidc-extra-audience=account
                - --authenticated-emails-file=/etc/game-auth/allowed-users
                - --email-domain=*
                - --client-id=${GAME_KEYCLOAK_CLIENT_ID}
                - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
                - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
                - --cookie-secure=true
                - --cookie-samesite=lax
                - --reverse-proxy=true
                - --proxy-websockets=true
                - --http-address=0.0.0.0:4180
                - --upstream=http://127.0.0.1:3000
                - --redirect-url=https://${GAME_HOST}/oauth2/callback
                - --skip-provider-button=true
              ports:
                - name: auth
                  containerPort: 4180
              volumeMounts:
                - name: game-auth
                  mountPath: /etc/game-auth
                  readOnly: true
          volumes:
            - name: game-data
              emptyDir: {}
            - name: game-auth
              configMap:
                name: ${GAME_NAME}-auth
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        game: ${GAME_ID}
    spec:
      selector:
        app: ${GAME_NAME}
      ports:
        - name: http
          port: 4180
          targetPort: auth
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        game: ${GAME_ID}
    spec:
      ingressClassName: traefik
      tls:
        - hosts:
            - ${GAME_HOST}
          secretName: ${GAME_TLS_SECRET}
      rules:
        - host: ${GAME_HOST}
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${GAME_NAME}
                    port:
                      name: http
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${GAME_NAME}-auth
      namespace: ${GAME_NAMESPACE}
      labels:
        game: ${GAME_ID}
    data:
      allowed-users: ${GAME_USERNAME}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${GAME_NAME}-auth-cookie
      namespace: ${GAME_NAMESPACE}
      labels:
        game: ${GAME_ID}
    type: Opaque
    data:
      cookie-secret: ${GAME_KEYCLOAK_COOKIE_SECRET}
      client-secret: ${GAME_KEYCLOAK_CLIENT_SECRET}
