name: Cave Story
description: An amnesiac boy awakens in a dark cave with no memory of who he is or how he got there. After finding a village of rabbit-like Mimigas threatened by a maniacal scientist, he must uncover the world's secrets, stop the villain, and save the Mimigas.
image: /images/cavestory.png
resources:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        app: ${GAME_NAME}
        game: ${GAME_ID}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${GAME_NAME}
      template:
        metadata:
          labels:
            app: ${GAME_NAME}
            game: ${GAME_ID}
        spec:
          containers:
            - name: ${GAME_ID}
              image: ghcr.io/nayetdet/cavestory-nx-docker:latest
              ports:
                - name: http
                  containerPort: 3000
              readinessProbe:
                httpGet:
                  path: /
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 12
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        game: ${GAME_ID}
    spec:
      selector:
        app: ${GAME_NAME}
      ports:
        - name: http
          port: 3000
          targetPort: http
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        game: ${GAME_ID}
    spec:
      ingressClassName: traefik
      tls:
        - hosts:
            - ${GAME_HOST}
          secretName: ${GAME_TLS_SECRET}
      rules:
        - host: ${GAME_HOST}
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${GAME_NAME}
                    port:
                      name: http
