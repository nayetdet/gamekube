name: Hyper Dragon Ball Z
description: Hyper Dragon Ball Z is a free fan-made fighting game built with the M.U.G.E.N engine by Team Z2, featuring original character art, animations, and a combat system inspired by the Dragon Ball Z anime.
image: /images/hyperdbz.png
hasSave: true
resources:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${GAME_ID}-${GAME_USER_ID}
      namespace: ${GAME_NAMESPACE}
      labels:
        game: "${GAME_ID}"
        user: ${GAME_USER_ID}
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        app: ${GAME_NAME}
        game: "${GAME_ID}"
        user: ${GAME_USER_ID}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${GAME_NAME}
      template:
        metadata:
          labels:
            app: ${GAME_NAME}
            game: "${GAME_ID}"
            user: ${GAME_USER_ID}
        spec:
          terminationGracePeriodSeconds: 240
          securityContext:
            fsGroup: 911
          initContainers:
            - name: seed-game-data
              image: ghcr.io/nayetdet/hyperdbz-docker:latest
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  [ -f /data/mugen.cfg ] || cp "/opt/hyperdbz/HyperDBZWickedAmbition/Hyper DBZ 6.0c/data/mugen.cfg" /data/mugen.cfg &&
                  chown 911:911 /data/mugen.cfg &&
                  chmod u+rw /data/mugen.cfg
              volumeMounts:
                - {name: game-data, mountPath: /data}
            - name: restore-game-data
              image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef: {name: minio, key: rootUser}
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: minio, key: rootPassword}
                - name: MC_HOST_storage
                  value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio.${GAME_NAMESPACE}.svc:9000
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  if [ -f /data/.gamekube-initialized ]; then exit 0; fi
                  save_path="storage/${GAME_SAVE_BUCKET}/${GAME_ID}/${GAME_USER_ID}"
                  : > /data/.gamekube-prefix
                  mc cp /data/.gamekube-prefix "$save_path/.gamekube-prefix"
                  mc mirror --overwrite "$save_path" /data
                  chown 911:911 /data/mugen.cfg
                  chmod u+rw /data/mugen.cfg
                  rm -f /data/.gamekube-prefix
                  mc rm "$save_path/.gamekube-prefix"
                  touch /data/.gamekube-initialized
              volumeMounts:
                - {name: game-data, mountPath: /data}
          containers:
            - name: ${GAME_ID}
              image: ghcr.io/nayetdet/hyperdbz-docker:latest
              lifecycle:
                preStop:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - |
                        s6-svc -d /run/service/hyperdbz >/dev/null 2>&1 || true
                        if ! timeout --signal=TERM --kill-after=5s 60s s6-svc -wD /run/service/hyperdbz; then
                          s6-svc -k /run/service/hyperdbz >/dev/null 2>&1 || true
                          timeout --signal=TERM --kill-after=5s 10s s6-svc -wD /run/service/hyperdbz || true
                        fi
                        touch /gamekube-lifecycle/game-stopped
              volumeMounts:
                - {name: game-lifecycle, mountPath: /gamekube-lifecycle}
                - {name: game-data, mountPath: /config/.wine}
                - name: game-data
                  mountPath: "/opt/hyperdbz/HyperDBZWickedAmbition/Hyper DBZ 6.0c/data/mugen.cfg"
                  subPath: mugen.cfg
              ports:
                - name: http
                  containerPort: 3000
              readinessProbe:
                httpGet:
                  path: /
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 12
            - name: persist-game-data
              image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef: {name: minio, key: rootUser}
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: minio, key: rootPassword}
                - name: MC_HOST_storage
                  value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio.${GAME_NAMESPACE}.svc:9000
              command: ["/bin/sh", "-c"]
              args:
                - |
                  trap 'touch /gamekube-lifecycle/game-stopped' TERM INT
                  while true; do
                    if [ -f /gamekube-lifecycle/game-stopped ]; then
                      attempt=0
                      while [ "$attempt" -lt 3 ]; do
                        if timeout --signal=TERM --kill-after=5s 30s mc mirror --remove --overwrite /data "storage/${GAME_SAVE_BUCKET}/${GAME_ID}/${GAME_USER_ID}"; then
                          touch /gamekube-lifecycle/sync-complete
                          break
                        fi
                        attempt=$((attempt + 1))
                        if [ "$attempt" -lt 3 ]; then sleep 5; fi
                      done
                      if [ ! -f /gamekube-lifecycle/sync-complete ]; then
                        touch /gamekube-lifecycle/sync-failed
                      fi
                      break
                    fi
                    timeout --signal=TERM --kill-after=5s 20s mc mirror --remove --overwrite /data "storage/${GAME_SAVE_BUCKET}/${GAME_ID}/${GAME_USER_ID}" || true
                    sleep 10
                  done
              lifecycle:
                preStop:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - |
                        attempt=0
                        while [ "$attempt" -lt 90 ] && [ ! -f /gamekube-lifecycle/game-stopped ]; do
                          attempt=$((attempt + 1))
                          sleep 1
                        done
              volumeMounts:
                - {name: game-lifecycle, mountPath: /gamekube-lifecycle}
                - {name: game-data, mountPath: /data}
            - name: oauth2-proxy
              image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
              env:
                - name: OAUTH2_PROXY_COOKIE_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${GAME_NAME}-auth-cookie
                      key: cookie-secret
                - name: OAUTH2_PROXY_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${GAME_NAME}-auth-cookie
                      key: client-secret
              args:
                - --provider=keycloak-oidc
                - --oidc-issuer-url=${GAME_KEYCLOAK_INTERNAL_ISSUER_URL}
                - --login-url=${GAME_KEYCLOAK_ISSUER_URL}/protocol/openid-connect/auth
                - --redeem-url=${GAME_KEYCLOAK_INTERNAL_ISSUER_URL}/protocol/openid-connect/token
                - --oidc-jwks-url=${GAME_KEYCLOAK_INTERNAL_ISSUER_URL}/protocol/openid-connect/certs
                - --skip-oidc-discovery
                - --code-challenge-method=S256
                - --insecure-oidc-skip-issuer-verification=true
                - --oidc-audience-claim=azp
                - --oidc-email-claim=preferred_username
                - --oidc-extra-audience=account
                - --authenticated-emails-file=/etc/game-auth/allowed-users
                - --email-domain=*
                - --client-id=${GAME_KEYCLOAK_CLIENT_ID}
                - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
                - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
                - --cookie-secure=true
                - --cookie-samesite=lax
                - --reverse-proxy=true
                - --proxy-websockets=true
                - --http-address=0.0.0.0:4180
                - --upstream=http://127.0.0.1:3000
                - --redirect-url=https://${GAME_HOST}/oauth2/callback
                - --skip-provider-button=true
              ports:
                - name: auth
                  containerPort: 4180
              volumeMounts:
                - name: game-auth
                  mountPath: /etc/game-auth
                  readOnly: true
          volumes:
            - name: game-data
              persistentVolumeClaim:
                claimName: ${GAME_ID}-${GAME_USER_ID}
            - name: game-lifecycle
              emptyDir: {}
            - name: game-auth
              configMap:
                name: ${GAME_NAME}-auth
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        game: "${GAME_ID}"
    spec:
      selector:
        app: ${GAME_NAME}
      ports:
        - name: http
          port: 4180
          targetPort: auth
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ${GAME_NAME}
      namespace: ${GAME_NAMESPACE}
      labels:
        game: "${GAME_ID}"
    spec:
      ingressClassName: traefik
      tls:
        - hosts:
            - ${GAME_HOST}
          secretName: ${GAME_TLS_SECRET}
      rules:
        - host: ${GAME_HOST}
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${GAME_NAME}
                    port:
                      name: http
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${GAME_NAME}-auth
      namespace: ${GAME_NAMESPACE}
      labels:
        game: "${GAME_ID}"
    data:
      allowed-users: ${GAME_USERNAME}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${GAME_NAME}-auth-cookie
      namespace: ${GAME_NAMESPACE}
      labels:
        game: "${GAME_ID}"
    type: Opaque
    data:
      cookie-secret: ${GAME_KEYCLOAK_COOKIE_SECRET}
      client-secret: ${GAME_KEYCLOAK_CLIENT_SECRET}
