server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: gamekube
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:gamekubedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:7000/realms/gamekube}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

game:
  namespace: gamekube
  domain: gamekube.localhost
  tls-secret: gamekube-tls
  protocol: https
  readiness-timeout-seconds: 120
