server:
  port: 8081
spring:
  application:
    name: gamekube
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7000/realms/gamekube
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
game:
  namespace: gamekube
  domain: gamekube.localhost
  tls-secret: gamekube-tls
  protocol: https
  readiness-timeout-seconds: 120
