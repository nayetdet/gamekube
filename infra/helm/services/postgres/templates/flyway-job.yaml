{{- if .Values.flyway.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-flyway
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flyway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: {{ .Values.flyway.image.repository }}:{{ .Values.flyway.image.tag }}
          imagePullPolicy: {{ .Values.flyway.image.pullPolicy }}
          args:
            - -url=jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}
            - -user={{ .Values.postgresql.auth.username }}
            - -password=$(POSTGRES_PASSWORD)
            - -schemas=gamekube
            - -defaultSchema=gamekube
            - -connectRetries={{ .Values.flyway.connectRetries }}
            - migrate
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
{{- end }}
